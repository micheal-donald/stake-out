# Nginx Rate Limiting Zones for Battle Arena
# Include this in main nginx.conf within http {} block
#
# Usage: include /etc/nginx/conf.d/rate-limits.conf;

# =======================
# RATE LIMITING ZONES
# =======================

# General API rate limiting (10 requests/second per IP)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Auth endpoints (stricter - 5 requests/second)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# Payment endpoints (very strict - 2 requests/second)
limit_req_zone $binary_remote_addr zone=payment:10m rate=2r/s;

# Static assets (more lenient - 20 requests/second)
limit_req_zone $binary_remote_addr zone=assets:10m rate=20r/s;

# Game actions (10 requests/second per user)
limit_req_zone $cookie_token zone=game:10m rate=10r/s;

# =======================
# CONNECTION LIMITING
# =======================

# Limit concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=addr:10m;

# =======================
# REQUEST SIZE LIMITS
# =======================

# Limit request body size by zone
# This is set in server {} blocks
# client_max_body_size 10M;  # API uploads
# client_max_body_size 1M;   # Regular requests

# =======================
# CUSTOM ERROR RESPONSES
# =======================

