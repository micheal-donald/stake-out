# Kubernetes Deployment for Stake Out Bet Frontend Service
# Handles the React SPA with nginx reverse proxy

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stakeoutbet-frontend
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stakeoutbet
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stakeoutbet
        app.kubernetes.io/component: frontend
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      
      # Service account
      serviceAccountName: stakeoutbet-frontend
      
      # Pod anti-affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - frontend
              topologyKey: kubernetes.io/hostname
      
      # Init container to wait for backend
      initContainers:
      - name: wait-for-backend
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          until nc -z stakeoutbet-backend-service 4000; do
            echo "Waiting for backend service..."
            sleep 5
          done
          echo "Backend service is ready!"
      
      containers:
      - name: frontend
        image: stakeoutbet/frontend:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        
        env:
        - name: API_URL
          value: "http://stakeoutbet-backend-service:4000"
        
        - name: WS_URL
          value: "ws://stakeoutbet-backend-service:4000"
        
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: NODE_ENV
        
        # Resource limits and requests
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
        
        # Volume mounts for nginx
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Startup probe
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      
      # Volumes
      volumes:
      - name: nginx-config
        configMap:
          name: stakeoutbet-nginx-config
          items:
          - key: nginx.conf
            path: nginx.conf
          - key: default.conf
            path: default.conf
      - name: nginx-cache
        emptyDir:
          sizeLimit: 50Mi
      - name: nginx-run
        emptyDir:
          sizeLimit: 10Mi
      
      # Termination grace period
      terminationGracePeriodSeconds: 30
      
      # DNS policy
      dnsPolicy: ClusterFirst
      
      # Restart policy
      restartPolicy: Always

---
# Service for Frontend
apiVersion: v1
kind: Service
metadata:
  name: stakeoutbet-frontend-service
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: frontend

---
# Service Account for Frontend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stakeoutbet-frontend
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false