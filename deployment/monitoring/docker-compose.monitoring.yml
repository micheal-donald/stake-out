# Comprehensive Monitoring Stack for Stake Out Bet
# Includes Prometheus, Grafana, AlertManager, and log aggregation

version: '3.8'

services:
  # ========================================
  # PROMETHEUS - METRICS COLLECTION
  # ========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: stakeoutbet-prometheus
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - monitoring

  # ========================================
  # GRAFANA - VISUALIZATION
  # ========================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: stakeoutbet-grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      # Security
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-your-secret-key}
      
      # Configuration
      GF_USERS_ALLOW_SIGN_UP: false
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
      
      # Database (SQLite for simplicity, use PostgreSQL in production)
      GF_DATABASE_TYPE: sqlite3
      GF_DATABASE_PATH: /var/lib/grafana/grafana.db
      
      # SMTP Configuration (optional)
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-alerts@stakeoutbet.com}
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - monitoring
    
    depends_on:
      - prometheus

  # ========================================
  # ALERTMANAGER - ALERT ROUTING
  # ========================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: stakeoutbet-alertmanager
    restart: unless-stopped
    
    ports:
      - "9093:9093"
    
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--web.route-prefix=/'
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - monitoring

  # ========================================
  # NODE EXPORTER - SYSTEM METRICS
  # ========================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: stakeoutbet-node-exporter
    restart: unless-stopped
    
    ports:
      - "9100:9100"
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    
    networks:
      - monitoring

  # ========================================
  # CADVISOR - CONTAINER METRICS
  # ========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: stakeoutbet-cadvisor
    restart: unless-stopped
    
    ports:
      - "8080:8080"
    
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    
    privileged: true
    
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,accelerator,hugetlb,referenced_memory,cpu_topology,resctrl'
    
    networks:
      - monitoring

  # ========================================
  # ELASTICSEARCH - LOG STORAGE
  # ========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: stakeoutbet-elasticsearch
    restart: unless-stopped
    
    ports:
      - "9200:9200"
    
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    networks:
      - monitoring

  # ========================================
  # KIBANA - LOG VISUALIZATION
  # ========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    container_name: stakeoutbet-kibana
    restart: unless-stopped
    
    ports:
      - "5601:5601"
    
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: false
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    networks:
      - monitoring
    
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ========================================
  # LOGSTASH - LOG PROCESSING
  # ========================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.9.0
    container_name: stakeoutbet-logstash
    restart: unless-stopped
    
    ports:
      - "5044:5044"   # Beats input
      - "5000:5000"   # TCP input
    
    environment:
      LS_JAVA_OPTS: "-Xmx1g -Xms1g"
    
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    
    networks:
      - monitoring
    
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ========================================
  # FILEBEAT - LOG SHIPPING
  # ========================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.9.0
    container_name: stakeoutbet-filebeat
    restart: unless-stopped
    
    user: root
    
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    command: ["--strict.perms=false"]
    
    networks:
      - monitoring
    
    depends_on:
      - logstash

  # ========================================
  # JAEGER - DISTRIBUTED TRACING
  # ========================================
  jaeger:
    image: jaegertracing/all-in-one:1.48
    container_name: stakeoutbet-jaeger
    restart: unless-stopped
    
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
      - "6831:6831/udp"  # Jaeger agent
    
    environment:
      COLLECTOR_OTLP_ENABLED: true
    
    networks:
      - monitoring

  # ========================================
  # BLACKBOX EXPORTER - UPTIME MONITORING
  # ========================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: stakeoutbet-blackbox
    restart: unless-stopped
    
    ports:
      - "9115:9115"
    
    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro
    
    command:
      - '--config.file=/config/blackbox.yml'
    
    networks:
      - monitoring

# ========================================
# NETWORKS
# ========================================
networks:
  monitoring:
    driver: bridge
    name: stakeoutbet-monitoring

# ========================================
# VOLUMES
# ========================================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  elasticsearch-data:
    driver: local