version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: stakeoutbet-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_BUSINESS_SHORTCODE=${MPESA_BUSINESS_SHORTCODE}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - PAYMENT_MODULE_URL=http://payment-module:3001
      - PAYMENT_MODULE_API_KEY=${PAYMENT_MODULE_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - "4000:4000"
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    depends_on:
      - postgres
      - redis
      - payment-module
    networks:
      - stakeoutbet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.stakeoutbet.com`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_SOCKET_URL=${REACT_APP_SOCKET_URL}
    container_name: stakeoutbet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - stakeoutbet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`stakeoutbet.com`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"

  # Payment Module Service
  payment-module:
    build:
      context: ./payment-module
      dockerfile: Dockerfile
    container_name: stakeoutbet-payment-module
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_BUSINESS_SHORTCODE=${MPESA_BUSINESS_SHORTCODE}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - API_KEY=${PAYMENT_MODULE_API_KEY}
    ports:
      - "3001:3001"
    volumes:
      - payment_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - stakeoutbet

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: stakeoutbet-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - stakeoutbet
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: stakeoutbet-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - stakeoutbet
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: stakeoutbet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - stakeoutbet

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: stakeoutbet-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - stakeoutbet
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: stakeoutbet-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - stakeoutbet

  # Log Management - Loki
  loki:
    image: grafana/loki:latest
    container_name: stakeoutbet-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - stakeoutbet
    command: -config.file=/etc/loki/local-config.yaml

  # Log Shipping - Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: stakeoutbet-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - backend_logs:/var/log/backend:ro
      - payment_logs:/var/log/payment:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - stakeoutbet
    command: -config.file=/etc/promtail/config.yml

  # Backup Service
  backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: stakeoutbet-backup
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${BACKUP_S3_BUCKET}
    volumes:
      - backup_data:/backups
    depends_on:
      - postgres
    networks:
      - stakeoutbet

networks:
  stakeoutbet:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  backend_backups:
    driver: local
  payment_logs:
    driver: local
  nginx_ssl:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  backup_data:
    driver: local