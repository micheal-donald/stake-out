# Grafana Dashboard Provisioning Configuration

apiVersion: 1

providers:
  - name: 'StakeOut Bet Dashboards'
    orgId: 1
    folder: 'StakeOut Bet'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards