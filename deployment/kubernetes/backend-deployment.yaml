# Kubernetes Deployment for Stake Out Bet Backend Service
# Handles the Node.js/Express API with Socket.IO for real-time gaming

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stakeoutbet-backend
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stakeoutbet
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stakeoutbet
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      # Service account
      serviceAccountName: stakeoutbet-backend
      
      # Pod anti-affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      
      # Init container to wait for dependencies
      initContainers:
      - name: wait-for-redis
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          until nc -z stakeoutbet-redis-service 6379; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready!"
      
      containers:
      - name: backend
        image: stakeoutbet/backend:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 4000
          protocol: TCP
        
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: NODE_ENV
        
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: BACKEND_PORT
        
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: LOG_LEVEL
        
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: LOG_FORMAT
        
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: JWT_SECRET
        
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: JWT_EXPIRES_IN
        
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: DATABASE_URL
        
        - name: REDIS_URL
          value: "redis://$(REDIS_HOST):$(REDIS_PORT)"
        
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: REDIS_HOST
        
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: REDIS_PORT
        
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: FRONTEND_URL
        
        - name: MPESA_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: MPESA_CONSUMER_KEY
        
        - name: MPESA_CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: MPESA_CONSUMER_SECRET
        
        - name: MPESA_PASSKEY
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: MPESA_PASSKEY
        
        - name: MPESA_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: MPESA_ENVIRONMENT
        
        - name: MPESA_BUSINESS_SHORT_CODE
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: MPESA_BUSINESS_SHORT_CODE
        
        - name: MPESA_CALLBACK_URL
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: MPESA_CALLBACK_URL
        
        - name: NODE_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: NODE_OPTIONS
        
        # Resource limits and requests
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        
        # Volume mounts for writable directories
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Startup probe for slower initialization
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
      
      # Volumes for writable directories
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 100Mi
      - name: logs-volume
        emptyDir:
          sizeLimit: 500Mi
      
      # Termination grace period for WebSocket connections
      terminationGracePeriodSeconds: 60
      
      # DNS policy for service discovery
      dnsPolicy: ClusterFirst
      
      # Restart policy
      restartPolicy: Always

---
# Service for Backend
apiVersion: v1
kind: Service
metadata:
  name: stakeoutbet-backend-service
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 4000
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: backend
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300

---
# Service Account for Backend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stakeoutbet-backend
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: backend
automountServiceAccountToken: false