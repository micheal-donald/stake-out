# Kubernetes namespace for Stake Out Bet application
# This isolates all application resources within a dedicated namespace

apiVersion: v1
kind: Namespace
metadata:
  name: stakeoutbet
  labels:
    name: stakeoutbet
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Stake Out Bet real-time gambling application"