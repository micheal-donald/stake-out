# Production Docker Compose Configuration
# This is a production-ready setup with security and performance optimizations
# Use this for staging/production deployments with external database and Redis

version: '3.8'

services:
  # ========================================
  # BACKEND SERVICE
  # ========================================
  backend:
    image: stakeoutbet/backend:${BACKEND_VERSION:-latest}
    container_name: stakeoutbet-backend-prod
    restart: unless-stopped
    
    # Security: Run as non-root user
    user: "1001:1001"
    
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    
    environment:
      NODE_ENV: production
      PORT: 4000
      
      # Database configuration (use external managed database)
      DATABASE_URL: ${DATABASE_URL}
      
      # Redis configuration (use external managed Redis)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      
      # JWT and security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      
      # CORS configuration
      FRONTEND_URL: ${FRONTEND_URL:-https://stakeoutbet.com}
      
      # M-Pesa configuration
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-production}
      MPESA_BUSINESS_SHORT_CODE: ${MPESA_BUSINESS_SHORT_CODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL}
      
      # Logging configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      
      # Performance tuning
      NODE_OPTIONS: "--max-old-space-size=3072"
      
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "stakeoutbet-backend"
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=100M
      - /app/logs:size=50M
    
    # Networks
    networks:
      - stakeoutbet-network
    
    # Dependencies
    depends_on:
      redis:
        condition: service_healthy

  # ========================================
  # FRONTEND SERVICE
  # ========================================
  frontend:
    image: stakeoutbet/frontend:${FRONTEND_VERSION:-latest}
    container_name: stakeoutbet-frontend-prod
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    environment:
      # Backend API configuration
      API_URL: ${API_URL:-http://backend:4000}
      WS_URL: ${WS_URL:-ws://backend:4000}
      
      # Environment
      NODE_ENV: production
    
    ports:
      - "${FRONTEND_PORT:-80}:80"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "stakeoutbet-frontend"
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=50M
      - /var/run:size=10M
    
    # Networks
    networks:
      - stakeoutbet-network
    
    # Dependencies
    depends_on:
      backend:
        condition: service_healthy

  # ========================================
  # REDIS CACHE SERVICE
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: stakeoutbet-redis-prod
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 256M
    
    # Redis configuration
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --tcp-backlog 511
      --databases 2
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Persistent storage
    volumes:
      - redis-data:/data
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "stakeoutbet-redis"
    
    # Networks
    networks:
      - stakeoutbet-network

  # ========================================
  # MONITORING SERVICES (Optional)
  # ========================================
  
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: stakeoutbet-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    networks:
      - stakeoutbet-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: stakeoutbet-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    
    ports:
      - "3001:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    
    networks:
      - stakeoutbet-network
    
    depends_on:
      - prometheus

# ========================================
# NETWORKS
# ========================================
networks:
  stakeoutbet-network:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

# ========================================
# VOLUMES
# ========================================
volumes:
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/redis
  
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/prometheus
  
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/grafana