# Nginx Production Configuration for Battle Arena
# Complete setup with SSL, WebSocket support, and security hardening
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/battlearena
#   2. Create symlink: ln -s /etc/nginx/sites-available/battlearena /etc/nginx/sites-enabled/
#   3. Test: nginx -t
#   4. Reload: systemctl reload nginx

# Upstream backend servers (Node.js)
upstream backend_api {
    # Use least_conn for better load distribution
    least_conn;

    # Primary backend server
    server localhost:4000 max_fails=3 fail_timeout=30s;

    # Add more backend servers for load balancing (optional)
    # server localhost:4001 max_fails=3 fail_timeout=30s;
    # server localhost:4002 max_fails=3 fail_timeout=30s;

    # Keep connections alive for better performance
    keepalive 32;
}

# HTTP Server - Redirect all to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - Main Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # Root directory for static files (React build)
    root /var/www/battlearena/frontend/build;
    index index.html;

    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Security Settings (Mozilla Modern Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling (verify SSL cert is not revoked)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (adjust based on your needs)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://yourdomain.com https://yourdomain.com; frame-ancestors 'self';" always;

    # Logging
    access_log /var/log/nginx/battlearena_access.log combined;
    error_log /var/log/nginx/battlearena_error.log warn;

    # Client settings
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # =======================
    # API BACKEND ROUTES
    # =======================

    # API endpoints - Proxy to Node.js backend
    location /api/ {
        # Rate limiting for API (10 requests/second per IP)
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        # Proxy settings
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_intercept_errors on;
    }

    # Socket.IO WebSocket endpoint (real-time game updates)
    location /socket.io/ {
        # No rate limiting for WebSocket connections
        # (already rate limited by application)

        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (keep connections alive)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # =======================
    # STATIC FILES (React)
    # =======================

    # Static assets with aggressive caching
    location /static/ {
        alias /var/www/battlearena/frontend/build/static/;

        # Cache static assets for 1 year (they have hashes in filenames)
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Security headers (don't cache these)
        add_header X-Content-Type-Options "nosniff" always;

        # Gzip already enabled globally
        access_log off;
    }

    # Images, fonts, etc.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Manifest and service worker (short cache)
    location ~* (manifest\.json|service-worker\.js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # =======================
    # REACT SPA ROUTING
    # =======================

    # React Router - Serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =======================
    # SECURITY & MAINTENANCE
    # =======================

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* (\.env|\.git|\.gitignore|package\.json|package-lock\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (bypass all rate limits)
    location /health {
        proxy_pass http://backend_api/api/health;
        access_log off;
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /var/www/battlearena/error-pages;
        internal;
    }
}

