# SSL/TLS Security Parameters for Battle Arena
# Include this in server {} blocks handling HTTPS
#
# Usage: include /etc/nginx/snippets/ssl-params.conf;

# SSL Protocols (Only TLS 1.2 and 1.3)
ssl_protocols TLSv1.2 TLSv1.3;

# SSL Ciphers (Mozilla Modern Configuration - updated 2024)
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

# Prefer server ciphers
ssl_prefer_server_ciphers off;

# SSL Session Configuration
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
ssl_session_tickets off;

# Diffie-Hellman parameter for DHE ciphersuites
# Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096
ssl_dhparam /etc/nginx/dhparam.pem;

# OCSP Stapling (verify SSL certificate status)
ssl_stapling on;
ssl_stapling_verify on;

# DNS resolvers for OCSP
resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
resolver_timeout 5s;

# =======================
# SECURITY HEADERS
# =======================

# HTTP Strict Transport Security (HSTS)
# Tell browsers to always use HTTPS for this domain
# Start with short max-age (1 day), increase gradually to 2 years
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS filter in older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy (restrict browser features)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self), usb=()" always;

# =======================
# SSL PERFORMANCE
# =======================

# Enable TCP Fast Open (Linux 3.7+)
# Uncomment if your kernel supports it
# tcp_fastopen on;

# Enable 0-RTT (TLS 1.3 only)
# Can improve performance but has replay attack risk
# Only enable if your application handles replay attacks
# ssl_early_data on;
