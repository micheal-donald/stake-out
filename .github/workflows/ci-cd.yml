# GitHub Actions CI/CD Pipeline for Stake Out Bet
# Provides automated testing, building, and deployment

name: Stake Out Bet CI/CD

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '18'
  POSTGRES_VERSION: '15'

jobs:
  # ========================================
  # SECURITY AND CODE QUALITY CHECKS
  # ========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # ========================================
  # BACKEND TESTS AND BUILD
  # ========================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stakeoutbet_test
          POSTGRES_USER: test_user
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci --prefer-offline --no-audit
      
    - name: Run database migrations
      working-directory: ./database
      run: |
        npm install -g node-pg-migrate
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/stakeoutbet_test"
        node run-migrations.js
        
    - name: Run backend tests
      working-directory: ./backend
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/stakeoutbet_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test_jwt_secret_key_for_testing_only
      run: |
        # Run tests when they are implemented
        # npm test
        echo "Backend tests will run here when implemented"
        
    - name: Run linting
      working-directory: ./backend
      run: |
        # Run ESLint when configured
        # npm run lint
        echo "Backend linting will run here when configured"
        
    - name: Upload test coverage
      if: success()
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend

  # ========================================
  # FRONTEND TESTS AND BUILD
  # ========================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --prefer-offline --no-audit
      
    - name: Run frontend tests
      working-directory: ./frontend
      env:
        CI: true
        REACT_APP_API_URL: http://localhost:4000
      run: npm test -- --coverage --watchAll=false
      
    - name: Run frontend linting
      working-directory: ./frontend
      run: |
        # Run ESLint
        # npm run lint
        echo "Frontend linting will run here when configured"
        
    - name: Build frontend
      working-directory: ./frontend
      env:
        REACT_APP_API_URL: __API_URL_PLACEHOLDER__
        REACT_APP_WS_URL: __WS_URL_PLACEHOLDER__
        GENERATE_SOURCEMAP: false
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/build/
        retention-days: 7
        
    - name: Upload test coverage
      if: success()
      uses: codecov/codecov-action@v3
      with:
        directory: ./frontend/coverage
        flags: frontend

  # ========================================
  # DOCKER IMAGE BUILD AND PUSH
  # ========================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [security, backend-test, frontend-test]
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      packages: write
      
    strategy:
      matrix:
        service: [backend, frontend]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # ========================================
  # INTEGRATION TESTS
  # ========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Run integration tests with Docker Compose
      env:
        BACKEND_VERSION: ${{ github.sha }}
        FRONTEND_VERSION: ${{ github.sha }}
        DATABASE_URL: postgresql://stakeout_user:securepassword@localhost:5432/stakeoutbet_db
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test_jwt_secret_for_integration_tests
      run: |
        # Pull the built images
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        
        # Run integration tests
        docker-compose -f deployment/docker-compose.production.yml up -d
        
        # Wait for services to be ready
        sleep 30
        
        # Run health checks
        curl -f http://localhost:4000/health
        curl -f http://localhost:80/health
        
        # Run API integration tests
        # npm run test:integration
        
        # Cleanup
        docker-compose -f deployment/docker-compose.production.yml down

  # ========================================
  # STAGING DEPLOYMENT
  # ========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_STAGING }}
      
    - name: Deploy to staging
      run: |
        # Update image tags in deployment files
        sed -i "s|stakeoutbet/backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}|g" deployment/kubernetes/backend-deployment.yaml
        sed -i "s|stakeoutbet/frontend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}|g" deployment/kubernetes/frontend-deployment.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f deployment/kubernetes/namespace.yaml
        kubectl apply -f deployment/kubernetes/configmap.yaml
        kubectl apply -f deployment/kubernetes/secrets.yaml
        kubectl apply -f deployment/kubernetes/redis-deployment.yaml
        kubectl apply -f deployment/kubernetes/backend-deployment.yaml
        kubectl apply -f deployment/kubernetes/frontend-deployment.yaml
        kubectl apply -f deployment/kubernetes/ingress.yaml
        
        # Wait for deployment to complete
        kubectl rollout status deployment/stakeoutbet-backend -n stakeoutbet --timeout=300s
        kubectl rollout status deployment/stakeoutbet-frontend -n stakeoutbet --timeout=300s
        
    - name: Run smoke tests
      run: |
        # Wait for services to be ready
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=stakeoutbet -n stakeoutbet --timeout=300s
        
        # Run smoke tests
        STAGING_URL="https://staging.stakeoutbet.com"
        curl -f $STAGING_URL/health
        curl -f $STAGING_URL/api/health
        
    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ========================================
  # PRODUCTION DEPLOYMENT
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }}
      
    - name: Deploy to production
      run: |
        # Update image tags in deployment files
        sed -i "s|stakeoutbet/backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}|g" deployment/kubernetes/backend-deployment.yaml
        sed -i "s|stakeoutbet/frontend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}|g" deployment/kubernetes/frontend-deployment.yaml
        
        # Apply Kubernetes manifests with production configuration
        kubectl apply -f deployment/kubernetes/namespace.yaml
        kubectl apply -f deployment/kubernetes/configmap.yaml
        kubectl apply -f deployment/kubernetes/secrets.yaml
        kubectl apply -f deployment/kubernetes/redis-deployment.yaml
        kubectl apply -f deployment/kubernetes/backend-deployment.yaml
        kubectl apply -f deployment/kubernetes/frontend-deployment.yaml
        kubectl apply -f deployment/kubernetes/ingress.yaml
        
        # Rolling update with zero downtime
        kubectl rollout status deployment/stakeoutbet-backend -n stakeoutbet --timeout=600s
        kubectl rollout status deployment/stakeoutbet-frontend -n stakeoutbet --timeout=600s
        
    - name: Run production health checks
      run: |
        # Wait for services to be ready
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=stakeoutbet -n stakeoutbet --timeout=600s
        
        # Run comprehensive health checks
        PROD_URL="https://stakeoutbet.com"
        curl -f $PROD_URL/health
        curl -f $PROD_URL/api/health
        
        # Test WebSocket connectivity
        # wscat -c $PROD_URL/socket.io/?EIO=4&transport=websocket
        
    - name: Create deployment record
      run: |
        # Record deployment in monitoring system
        curl -X POST "${{ secrets.DATADOG_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "title": "Stake Out Bet Production Deployment",
            "text": "Deployed version ${{ github.sha }} to production",
            "alert_type": "success",
            "source_type_name": "github"
          }'
        
    - name: Notify production deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#production'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_PROD }}