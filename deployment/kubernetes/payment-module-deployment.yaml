# Kubernetes Deployment for Payment Module Service
# Handles M-Pesa integration and payment processing

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stakeoutbet-payment-module
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: payment-module
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stakeoutbet
      app.kubernetes.io/component: payment-module
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stakeoutbet
        app.kubernetes.io/component: payment-module
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Service account
      serviceAccountName: stakeoutbet-payment-module

      # Pod anti-affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - payment-module
              topologyKey: kubernetes.io/hostname

      # Init container to wait for dependencies
      initContainers:
      - name: wait-for-redis
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          until nc -z stakeoutbet-redis-service 6379; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready!"

      containers:
      - name: payment-module
        image: stakeoutbet/payment-module:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3001
          protocol: TCP

        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: NODE_ENV

        - name: PORT
          value: "3001"

        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: LOG_LEVEL

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: DATABASE_URL

        - name: REDIS_URL
          value: "redis://$(REDIS_HOST):$(REDIS_PORT)"

        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: REDIS_HOST

        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: REDIS_PORT

        - name: MPESA_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: MPESA_CONSUMER_KEY

        - name: MPESA_CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: MPESA_CONSUMER_SECRET

        - name: MPESA_PASSKEY
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: MPESA_PASSKEY

        - name: MPESA_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: MPESA_ENVIRONMENT

        - name: MPESA_BUSINESS_SHORT_CODE
          valueFrom:
            configMapKeyRef:
              name: stakeoutbet-config
              key: MPESA_BUSINESS_SHORT_CODE

        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: stakeoutbet-secrets
              key: PAYMENT_MODULE_API_KEY

        # Resource limits and requests
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

        # Volume mounts for writable directories
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs

        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Startup probe for slower initialization
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12

      # Volumes for writable directories
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 50Mi
      - name: logs-volume
        emptyDir:
          sizeLimit: 200Mi

      # Termination grace period
      terminationGracePeriodSeconds: 30

      # DNS policy for service discovery
      dnsPolicy: ClusterFirst

      # Restart policy
      restartPolicy: Always

---
# Service for Payment Module
apiVersion: v1
kind: Service
metadata:
  name: stakeoutbet-payment-module-service
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: payment-module
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3001
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: payment-module

---
# Service Account for Payment Module
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stakeoutbet-payment-module
  namespace: stakeoutbet
  labels:
    app.kubernetes.io/name: stakeoutbet
    app.kubernetes.io/component: payment-module
automountServiceAccountToken: false